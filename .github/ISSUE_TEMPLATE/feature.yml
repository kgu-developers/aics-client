name: '✨ Feature'
description: '새로운 기능 또는 명세가 있나요?'
title: '[Feature]: '
labels: 'feature'
body:
  - type: dropdown
    id: package
    attributes:
      label: Package Scope
      description: 패키지 범위를 선택해 주세요. (여러 개 선택 가능)
      multiple: true
      options:
        - '@aics-client/admin'
        - '@aics-client/community'
        - '@aics-client/graduate'
        - '@aics-client/design-system'
        - '@aics-client/tiptap'
        - '@aics-client/typescript'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe
      description: 새로운 기능에 대한 설명을 작성해 주세요.
      placeholder: 자세히 적을수록 좋습니다.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Tasks
      description: 해야 하는 일에 대한 Tasks를 작성해 주세요.
      placeholder: 최대한 세분화 해서 적어주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: ETC
      description: 더 전달할 내용이 있다면 여기에 작성해 주세요.
