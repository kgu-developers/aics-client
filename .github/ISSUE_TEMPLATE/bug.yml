name: '🐞 Bug'
description: '버그가 발생했나요?'
title: '[Bug]: '
labels: 'bug'
body:
  - type: dropdown
    id: package
    attributes:
      label: Package Scope
      description: 패키지 범위를 선택해 주세요. (여러 개 선택 가능)
      multiple: true
      options:
        - '@aics-client/admin'
        - '@aics-client/community'
        - '@aics-client/design-system'
        - '@aics-client/tiptap'
        - '@aics-client/typescript'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 버그 설명
      description: 버그에 대한 설명을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 예상 결과
      description: 예상한 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 실제 결과
      description: 실제 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 시뮬레이션
      description: 버그를 발견하게 된 상황을 단계별로 적어주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: ETC
      description: 더 전달할 내용이 있다면 여기에 작성해 주세요.
