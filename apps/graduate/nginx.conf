server {
    listen 80;
    server_name _;

    # Vite/React 등 SPA 빌드 결과 위치
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 정적 파일이 없으면 SPA 라우팅을 위해 index.html 반환
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/graduate_access.log;
    error_log /var/log/nginx/graduate_error.log;
}

